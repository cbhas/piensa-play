name: piensa_play
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.4
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.1
  audioplayers: ^5.2.1
  youtube_player_flutter: ^9.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  home_widget: ^0.7.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/
    - assets/icons/
    - assets/avatars/
    - assets/audio/
    - assets/audio/mascot/
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"